appId: com.rednikin.duet
productName: Duet

# Windows кладёт описание из package.json в свойства .exe, и браузер
# показывает его в вопросе «открыть приложение?». Длинная фраза там
# выглядит как чужая программа — в свойствах файла должно стоять имя.
# Описание при этом остаётся в package.json для самого репозитория.
extraMetadata:
  description: Duet
# Откуда приложение берёт обновления.
#
# Установщики уже лежат в релизах репозитория, но одних установщиков мало:
# рядом должен появиться latest.yml — в нём записано, какая версия последняя,
# и с чем сверять скачанный файл. Раньше этого раздела не было, поэтому файл
# не собирался и в релизы не попадал; отсюда и проверять обновление было не по
# чему. Загружается он тем же `npm run release`.
publish:
  provider: github
  owner: RanderOneLove
  repo: Duet
  releaseType: release

directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  # The tray icon is loaded from disk at runtime, not bundled.
  - from: resources/tray.ico
    to: tray.ico
# Установщик регистрирует схему в системе — так Windows узнаёт, что ссылку
# duet://join/... открывает Duet. В запуске из исходников регистрируется
# бинарник Electron, что для разработки нормально.
protocols:
  - name: Duet
    schemes:
      - duet

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Duet
artifactName: ${productName}-${version}-setup.${ext}
